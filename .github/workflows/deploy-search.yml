name: Build Search Index & Deploy to Pages

on:
  # Runs when you push text files, the Excel, or the site itself
  push:
    branches: ["main"]
    paths:
      - "searchable_pdfs/text/**"
      - "ELG_Database.xlsx"
      - "site/**"
      - "build_index.py"

  # Lets you trigger manually from the Actions tab
  workflow_dispatch:

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Build search index
        run: python build_index.py --text-dir searchable_pdfs/text --excel ELG_Database.xlsx --output site/search_data.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
